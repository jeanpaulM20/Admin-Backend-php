name: SihlTrainer
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
targets:
  SihlTrainer:
    type: application
    platform: iOS
    sources:
      - path: SihlTrainer
    # Echtes Info.plist statt INFOPLIST_KEY_-Settings — dieselbe Lektion wie in
    # client-ios: nicht jeder Schlüssel hat ein Build-Setting-Pendant, fehlende
    # werden still ignoriert.
    info:
      path: SihlTrainer/Info.plist
      properties:
        CFBundleDisplayName: SIHL Trainer
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "SIHL Trainer wählt Bilder für Übungssymbole und Kundendateien aus deiner Mediathek."
        NSCameraUsageDescription: "SIHL Trainer nimmt auf Wunsch ein Foto für Übungssymbole und Kundendateien auf."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.sihltraining.SihlTrainer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        # 1,2 = iPhone + iPad (client-ios ist bewusst nur "1")
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5T2L372D79
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
