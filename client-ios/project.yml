name: SihlClient
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
targets:
  SihlClient:
    type: application
    platform: iOS
    sources:
      - path: SihlClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.sihltraining.SihlClient
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: ["remote-notification", "bluetooth-central"]
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "SihlClient verbindet sich mit deinem Herzfrequenz-Brustgurt (z.B. Polar H10), um dein Training aufzuzeichnen."
        INFOPLIST_KEY_CFBundleDisplayName: SihlClient
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5T2L372D79
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
