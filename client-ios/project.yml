name: SihlClient
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
targets:
  SihlClient:
    type: application
    platform: iOS
    sources:
      - path: SihlClient
    # Echtes Info.plist (von xcodegen generiert): UIBackgroundModes hat KEIN
    # INFOPLIST_KEY_-Pendant in Xcode — als Build-Setting wird es still
    # ignoriert, und allowsBackgroundLocationUpdates stürzt dann zur Laufzeit
    # mit NSException ab.
    info:
      path: SihlClient/Info.plist
      properties:
        CFBundleDisplayName: SIHLMOVE
        # Ohne diese Angaben gilt die App als englisch: SwiftUIs
        # .dateTime-Formate schrieben dann "Saturday, 29 August 2026"
        CFBundleDevelopmentRegion: de_CH
        CFBundleLocalizations: [de]
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
          - bluetooth-central
          - location
        NSBluetoothAlwaysUsageDescription: "SihlClient verbindet sich mit deinem Herzfrequenz-Brustgurt (z.B. Polar H10), um dein Training aufzuzeichnen."
        NSLocationWhenInUseUsageDescription: "SihlClient zeichnet deine Route bei Outdoor-Trainings auf (Joggen, Radfahren, Wandern)."
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "SihlClient nimmt nach dem Training auf Wunsch ein Foto auf, das in deiner Trainings-Galerie erscheint."
        NSPhotoLibraryUsageDescription: "SihlClient wählt auf Wunsch ein Foto aus deiner Mediathek für deine Trainings-Galerie."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.sihltraining.SihlClient
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5T2L372D79
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
