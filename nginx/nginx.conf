upstream php_backend {
    server php:80;
}

upstream nestjs_backend {
    server nestjs:3000;
}

# Gemeinsame Proxy-Header als Map-Variable
map $uri $proxy_target {
    default "php";
}

server {
    listen 80;

    proxy_set_header Host             $host;
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Auth-Token     $http_x_auth_token;

    # -------------------------------------------------------
    # FLUTTER WEB APPS (statische Dateien)
    # -------------------------------------------------------
    location /trainer/ {
        alias /usr/share/nginx/trainer/;
        try_files $uri $uri/ /trainer/index.html;
    }
    location /client/ {
        alias /usr/share/nginx/client/;
        try_files $uri $uri/ /client/index.html;
    }

    # -------------------------------------------------------
    # CLIENT-APP PHP ENDPOINTS (müssen VOR /api/client stehen)
    # Diese Routen existieren nur im PHP-Backend
    # -------------------------------------------------------
    location ~ ^/api/token$              { proxy_pass http://php_backend; }
    location ~ ^/api/client/start/       { proxy_pass http://php_backend; }
    location ~ ^/api/client/calendar/    { proxy_pass http://php_backend; }
    location ~ ^/api/client/profile/     { proxy_pass http://php_backend; }
    location ~ ^/api/client/credits/     { proxy_pass http://php_backend; }
    location ~ ^/api/client/invoices/    { proxy_pass http://php_backend; }
    location ~ ^/api/client/tests/       { proxy_pass http://php_backend; }
    location ~ ^/api/client/appointment  { proxy_pass http://php_backend; }

    # -------------------------------------------------------
    # MIGRATED TO NESTJS
    # Endpoint hier eintragen sobald er in NestJS fertig ist
    # -------------------------------------------------------
    location ~ ^/api/trainer      { proxy_pass http://nestjs_backend; }
    location ~ ^/api/client       { proxy_pass http://nestjs_backend; }
    location ~ ^/api/training     { proxy_pass http://nestjs_backend; }
    location ~ ^/api/feedback     { proxy_pass http://nestjs_backend; }
    location ~ ^/api/exercise     { proxy_pass http://nestjs_backend; }
    location ~ ^/api/trainingplan { proxy_pass http://nestjs_backend; }
    location ~ ^/api/performance_test { proxy_pass http://nestjs_backend; }
    location ~ ^/api/anamnese    { proxy_pass http://nestjs_backend; }
    location ~ ^/api/review      { proxy_pass http://nestjs_backend; }

    # -------------------------------------------------------
    # NOCH IN PHP – alles andere geht zum alten Backend
    # -------------------------------------------------------
    location / {
        proxy_pass http://php_backend;
    }
}
