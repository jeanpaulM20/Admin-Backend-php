name: Build & Deploy Flutter Web App

on:
  push:
    branches: [ main ]
    paths:
      - 'trainer-flutter/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: trainer-flutter
        run: flutter pub get

      - name: Build Web
        working-directory: trainer-flutter
        run: flutter build web --release --base-href /trainer-app/

      - name: Copy build output to trainer-app/
        run: |
          rm -rf trainer-app
          cp -r trainer-flutter/build/web trainer-app

      - name: Commit updated trainer-app/ to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trainer-app/
          git diff --cached --quiet || git commit -m "chore: rebuild Flutter web app [skip ci]"
          git push
