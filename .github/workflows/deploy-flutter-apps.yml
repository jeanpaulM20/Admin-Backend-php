name: Deploy Flutter Apps

on:
  push:
    branches: [main]
    paths:
      - 'trainer-flutter/**'
      - 'client-flutter/**'
      - '.github/workflows/deploy-flutter-apps.yml'
  workflow_dispatch:

jobs:
  # ── Job 1: Build & deploy to production server ──
  deploy-server:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Build Trainer Web App
        working-directory: trainer-flutter
        run: |
          flutter pub get
          flutter build web --release --base-href /trainer/

      - name: Build Client Web App
        working-directory: client-flutter
        run: |
          flutter pub get
          flutter build web --release --base-href /client/

      - name: Copy push notification files
        run: |
          cp client-flutter/web/push-sw.js client-flutter/build/web/push-sw.js
          cp client-flutter/web/push-notifications.js client-flutter/build/web/push-notifications.js

      - name: Commit built output
        run: |
          rm -rf trainer client
          cp -r trainer-flutter/build/web trainer
          cp -r client-flutter/build/web client
          # Also sync to nestjs-backend/public* so Railway Docker build picks up
          # the latest Flutter web apps (Railway builds from nestjs-backend/ context)
          rm -rf nestjs-backend/public nestjs-backend/public-trainer
          cp -r client-flutter/build/web nestjs-backend/public
          cp -r trainer-flutter/build/web nestjs-backend/public-trainer
          cp client-flutter/web/push-sw.js nestjs-backend/public/push-sw.js
          cp client-flutter/web/push-notifications.js nestjs-backend/public/push-notifications.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trainer/ client/ nestjs-backend/public/ nestjs-backend/public-trainer/
          git diff --cached --quiet || git commit -m "chore: rebuild Flutter web apps [skip ci]"
          git push

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_PATH }}
            git pull origin main

  # ── Job 2: Build & deploy to GitHub Pages ──
  deploy-github-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Build Trainer Web App (GitHub Pages)
        working-directory: trainer-flutter
        run: |
          flutter pub get
          flutter build web --release --base-href /Admin-Backend-php/trainer/

      - name: Build Client Web App (GitHub Pages)
        working-directory: client-flutter
        run: |
          flutter pub get
          flutter build web --release --base-href /Admin-Backend-php/client/

      - name: Copy push notification files
        run: |
          cp client-flutter/web/push-sw.js client-flutter/build/web/push-sw.js
          cp client-flutter/web/push-notifications.js client-flutter/build/web/push-notifications.js

      - name: Prepare GitHub Pages content
        run: |
          mkdir -p gh-pages-output
          cp -r trainer-flutter/build/web gh-pages-output/trainer
          cp -r client-flutter/build/web gh-pages-output/client
          cat > gh-pages-output/index.html << 'INDEXEOF'
          <!DOCTYPE html>
          <html lang="de">
          <head><meta charset="UTF-8"><title>Sihl Training</title></head>
          <body style="font-family:sans-serif;padding:40px">
            <h2>Sihl Training Apps</h2>
            <ul>
              <li><a href="trainer/">Trainer App</a></li>
              <li><a href="client/">Client App</a></li>
            </ul>
          </body>
          </html>
          INDEXEOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-output
          publish_branch: gh-pages
