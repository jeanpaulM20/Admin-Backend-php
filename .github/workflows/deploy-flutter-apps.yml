name: Deploy Flutter Apps to Server

on:
  push:
    branches: [ main ]
    paths:
      - 'trainer-flutter/**'
      - 'client-flutter/**'
      - 'nginx/nginx.conf'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-flutter-apps.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      # ── Build Trainer App ──────────────────────────────────────
      - name: Build Trainer Web App
        working-directory: trainer-flutter
        run: |
          flutter pub get
          flutter build web --release --base-href /Admin-Backend-php/trainer/

      # ── Build Client App ──────────────────────────────────────
      - name: Build Client Web App
        working-directory: client-flutter
        run: |
          flutter pub get
          flutter build web --release --base-href /Admin-Backend-php/client/

      # ── Commit built files to main ────────────────────────────
      - name: Commit built output
        run: |
          rm -rf trainer client
          cp -r trainer-flutter/build/web trainer
          cp -r client-flutter/build/web client
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trainer/ client/
          git diff --cached --quiet || git commit -m "chore: rebuild Flutter web apps [skip ci]"
          git push

      # ── Deploy to server via SSH (optional — skips if secrets missing) ──
      - name: Deploy to Server
        if: ${{ secrets.SERVER_HOST != '' }}
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_PATH }}
            git pull origin main
            docker compose restart nginx || docker-compose restart nginx
