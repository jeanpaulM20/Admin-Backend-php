name: Deploy Flutter Apps

on:
  push:
    branches: [main]
    paths:
      - 'trainer-flutter/**'
      - 'client-flutter/**'
      - '.github/workflows/deploy-flutter-apps.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Build Trainer Web App
        working-directory: trainer-flutter
        run: |
          flutter pub get
          flutter build web --release --base-href /trainer/

      - name: Build Client Web App (for apps.sihltraining.ch)
        working-directory: client-flutter
        run: |
          flutter pub get
          flutter build web --release --base-href /client/

      - name: Commit built output
        run: |
          rm -rf trainer client
          cp -r trainer-flutter/build/web trainer
          cp -r client-flutter/build/web client
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trainer/ client/
          git diff --cached --quiet || git commit -m "chore: rebuild Flutter web apps [skip ci]"
          git push
