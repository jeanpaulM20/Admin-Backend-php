name: Build & Deploy Client Flutter Web App

on:
  push:
    branches: [ main ]
    paths:
      - 'client-flutter/**'
      - '.github/workflows/client-web.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: client-flutter
        run: flutter pub get

      - name: Build Web
        working-directory: client-flutter
        run: flutter build web --release --base-href /client/

      - name: Copy build output to client/
        run: |
          rm -rf client
          cp -r client-flutter/build/web client

      - name: Commit updated client/ to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/ CNAME
          git diff --cached --quiet || git commit -m "chore: rebuild client Flutter web app [skip ci]"
          git push
