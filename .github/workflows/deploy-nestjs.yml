name: Deploy NestJS Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'nestjs-backend/**'
      - 'client/**'
      - 'trainer/**'
      - 'scripts/deploy.sh'
      - '.github/workflows/deploy-nestjs.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Der SSH-Schritt zielt auf den alten PHP-Server. Produktiv liefert
      # Railway direkt aus dem Repo aus; sind die Server-Secrets nicht
      # gesetzt, wird hier übersprungen statt den Lauf rot zu färben —
      # sonst verdeckt ein toter Alt-Deploy echte Fehler.
      - name: Check server secrets
        id: server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -n "$SERVER_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SERVER_HOST ist nicht gesetzt - SSH-Deploy wird uebersprungen. Railway deployt unabhaengig davon."
          fi

      - name: Deploy via SSH
        if: steps.server.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_PATH }}
            git pull origin main
            sh scripts/deploy.sh
